<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Baloo"; src: url("fonts/f3.woff2") format("woff2"); font-weight: 400 800; }
  html, body { margin: 0; padding: 0; background: #F7E3DC; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #F7E3DC; font-family: "Baloo", sans-serif; }
  svg { position: absolute; inset: 0; }
  .cap {
    position: absolute; left: 0; right: 0; margin: 0 auto; width: fit-content; max-width: 940px; box-sizing: border-box;
    padding: 26px 44px 18px; border-radius: 40px; background: #FFFFFF; color: #2E2019;
    font-weight: 800; font-size: 78px; line-height: 1.05; text-align: center;
    border: 8px solid #2E2019; box-shadow: 0 14px 0 #2E2019; opacity: 0;
    transform-origin: 50% 50%; white-space: normal;
  }
  #cap2 { background: #FFF6F2; }
  #cap2:after {
    content: ""; position: absolute; left: 50%; bottom: -46px; margin-left: -30px;
    border-left: 30px solid transparent; border-right: 30px solid transparent; border-top: 42px solid #2E2019;
  }
  #outro { position: absolute; left: 0; right: 0; top: 0; height: 760px; opacity: 0; text-align: center; }
  #outro .t1 { margin-top: 210px; font-size: 128px; font-weight: 800; line-height: 0.98; color: #2E2019; }
  #outro .t1 span { color: #E2685F; }
  #outro .t2 { margin-top: 34px; display: inline-block; font-size: 60px; font-weight: 700; color: #FFFFFF;
    background: #2E2019; padding: 14px 40px 6px; border-radius: 999px; }
</style>
</head>
<body>
<div id="stage">
<svg id="svg" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="vig" cx="50%" cy="46%" r="70%">
      <stop offset="45%" stop-color="#8E1F1F" stop-opacity="0"/>
      <stop offset="100%" stop-color="#8E1F1F" stop-opacity="0.85"/>
    </radialGradient>
    <pattern id="tiles" width="120" height="120" patternUnits="userSpaceOnUse">
      <rect width="120" height="120" fill="#EBCFA8"/>
      <rect width="60" height="60" fill="#E4C49A"/>
      <rect x="60" y="60" width="60" height="60" fill="#E4C49A"/>
    </pattern>
  </defs>
  <g id="cam">
    <!-- room -->
    <rect x="-600" y="-600" width="2280" height="1880" fill="#F7E3DC"/>
    <g opacity="0.55" stroke="#EFCFC4" stroke-width="22">
      <line x1="-600" y1="420" x2="1680" y2="420"/>
      <line x1="-600" y1="520" x2="1680" y2="520"/>
    </g>
    <rect x="-600" y="1280" width="2280" height="1300" fill="url(#tiles)"/>
    <rect x="-600" y="1270" width="2280" height="22" fill="#D6A983"/>
    <!-- window -->
    <g transform="translate(110,640)">
      <rect width="210" height="250" rx="22" fill="#CFE6F2" stroke="#2E2019" stroke-width="10"/>
      <line x1="105" y1="0" x2="105" y2="250" stroke="#2E2019" stroke-width="8"/>
      <line x1="0" y1="125" x2="210" y2="125" stroke="#2E2019" stroke-width="8"/>
    </g>

    <!-- tail (behind body) -->
    <g id="tail">
      <path d="M 660 1340 C 800 1360 860 1260 830 1150 C 815 1095 860 1060 900 1090"
            fill="none" stroke="#2E2019" stroke-width="64" stroke-linecap="round"/>
      <path d="M 660 1340 C 800 1360 860 1260 830 1150 C 815 1095 860 1060 900 1090"
            fill="none" stroke="#F6D7A7" stroke-width="44" stroke-linecap="round"/>
    </g>

    <!-- body -->
    <ellipse cx="540" cy="1190" rx="215" ry="215" fill="#F6D7A7" stroke="#2E2019" stroke-width="11"/>
    <ellipse cx="540" cy="1230" rx="120" ry="140" fill="#FBE8CB"/>

    <!-- bowl -->
    <g id="bowl">
      <ellipse cx="0" cy="-58" rx="98" ry="22" fill="#8A5A3C" stroke="#2E2019" stroke-width="9"/>
      <circle cx="-40" cy="-66" r="14" fill="#B5733F" stroke="#2E2019" stroke-width="5"/>
      <circle cx="-8" cy="-74" r="14" fill="#C98A4E" stroke="#2E2019" stroke-width="5"/>
      <circle cx="26" cy="-68" r="14" fill="#B5733F" stroke="#2E2019" stroke-width="5"/>
      <circle cx="52" cy="-60" r="12" fill="#C98A4E" stroke="#2E2019" stroke-width="5"/>
      <path d="M -100 -56 L 100 -56 L 78 18 Q 0 34 -78 18 Z" fill="#6E9BEF" stroke="#2E2019" stroke-width="10" stroke-linejoin="round"/>
      <path d="M -88 -30 L 88 -30" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.7"/>
    </g>

    <!-- cat paw reaching to bowl -->
    <g id="reach" opacity="0">
      <line id="reachOut" x1="690" y1="1350" x2="760" y2="1350" stroke="#2E2019" stroke-width="66" stroke-linecap="round"/>
      <line id="reachIn" x1="690" y1="1350" x2="760" y2="1350" stroke="#F6D7A7" stroke-width="46" stroke-linecap="round"/>
    </g>

    <!-- front paws -->
    <g id="paws">
      <ellipse id="pawL" cx="470" cy="1396" rx="58" ry="34" fill="#F6D7A7" stroke="#2E2019" stroke-width="10"/>
      <ellipse id="pawR" cx="610" cy="1396" rx="58" ry="34" fill="#F6D7A7" stroke="#2E2019" stroke-width="10"/>
    </g>

    <!-- head -->
    <g id="head">
      <g id="earL">
        <path d="M 395 800 L 360 600 L 505 715 Z" fill="#F6D7A7" stroke="#2E2019" stroke-width="11" stroke-linejoin="round"/>
        <path d="M 405 760 L 385 650 L 470 720 Z" fill="#F4A7A3"/>
      </g>
      <g id="earR">
        <path d="M 685 800 L 720 600 L 575 715 Z" fill="#F6D7A7" stroke="#2E2019" stroke-width="11" stroke-linejoin="round"/>
        <path d="M 675 760 L 695 650 L 610 720 Z" fill="#F4A7A3"/>
      </g>
      <ellipse cx="540" cy="880" rx="215" ry="190" fill="#F6D7A7" stroke="#2E2019" stroke-width="11"/>
      <!-- forehead stripes -->
      <g stroke="#E39A5B" stroke-width="14" stroke-linecap="round" fill="none">
        <path d="M 540 705 L 540 760"/>
        <path d="M 500 712 L 510 755"/>
        <path d="M 580 712 L 570 755"/>
      </g>
      <!-- cheeks -->
      <ellipse id="blushL" cx="420" cy="955" rx="42" ry="22" fill="#F4A7A3" opacity="0.7"/>
      <ellipse id="blushR" cx="660" cy="955" rx="42" ry="22" fill="#F4A7A3" opacity="0.7"/>
      <!-- eyes open -->
      <g id="eyesOpen">
        <g id="eyeL" transform="translate(462,872)">
          <ellipse id="eyeLw" cx="0" cy="0" rx="46" ry="52" fill="#FFFFFF" stroke="#2E2019" stroke-width="9"/>
          <circle id="pupL" cx="0" cy="4" r="28" fill="#2E2019"/>
          <circle id="hlL" cx="-10" cy="-8" r="9" fill="#FFFFFF"/>
        </g>
        <g id="eyeR" transform="translate(618,872)">
          <ellipse id="eyeRw" cx="0" cy="0" rx="46" ry="52" fill="#FFFFFF" stroke="#2E2019" stroke-width="9"/>
          <circle id="pupR" cx="0" cy="4" r="28" fill="#2E2019"/>
          <circle id="hlR" cx="-10" cy="-8" r="9" fill="#FFFFFF"/>
        </g>
      </g>
      <!-- eyes closed (smug) -->
      <g id="eyesClosed" opacity="0" stroke="#2E2019" stroke-width="11" stroke-linecap="round" fill="none">
        <path d="M 420 880 Q 462 850 504 880"/>
        <path d="M 576 880 Q 618 850 660 880"/>
      </g>
      <!-- angry brows -->
      <g id="brows" opacity="0" stroke="#2E2019" stroke-width="12" stroke-linecap="round">
        <line x1="415" y1="790" x2="500" y2="815"/>
        <line x1="665" y1="790" x2="580" y2="815"/>
      </g>
      <!-- nose -->
      <path d="M 522 935 L 558 935 L 540 955 Z" fill="#E77F8A" stroke="#2E2019" stroke-width="7" stroke-linejoin="round"/>
      <!-- mouths -->
      <path id="mNeutral" d="M 540 956 Q 540 985 510 982 M 540 956 Q 540 985 570 982" fill="none" stroke="#2E2019" stroke-width="8" stroke-linecap="round"/>
      <ellipse id="mShock" cx="540" cy="1000" rx="30" ry="40" fill="#7A2F3A" stroke="#2E2019" stroke-width="8" opacity="0"/>
      <path id="mSmug" d="M 500 978 Q 540 1004 590 970" fill="none" stroke="#2E2019" stroke-width="9" stroke-linecap="round" opacity="0"/>
      <!-- whiskers -->
      <g stroke="#2E2019" stroke-width="6" stroke-linecap="round">
        <line x1="380" y1="930" x2="270" y2="910"/>
        <line x1="380" y1="955" x2="275" y2="965"/>
        <line x1="700" y1="930" x2="810" y2="910"/>
        <line x1="700" y1="955" x2="805" y2="965"/>
      </g>
      <!-- sweat drop -->
      <path id="sweat" d="M 735 760 Q 760 800 748 822 Q 735 840 720 822 Q 710 800 735 760 Z" fill="#9FD3F5" stroke="#2E2019" stroke-width="6" opacity="0"/>
    </g>

    <!-- human hand -->
    <g id="hand">
      <rect x="0" y="-48" width="700" height="96" rx="48" fill="#E8B894" stroke="#2E2019" stroke-width="10"/>
      <rect x="-14" y="-62" width="120" height="124" rx="54" fill="#E8B894" stroke="#2E2019" stroke-width="10"/>
      <rect x="640" y="-58" width="120" height="116" rx="20" fill="#5A7FD6" stroke="#2E2019" stroke-width="10"/>
    </g>

    <!-- 2cm marker -->
    <g id="marker" opacity="0">
      <line id="mkLine" x1="750" y1="1470" x2="790" y2="1470" stroke="#E2685F" stroke-width="9" stroke-linecap="round"/>
      <line id="mkA" x1="750" y1="1445" x2="750" y2="1495" stroke="#E2685F" stroke-width="9" stroke-linecap="round"/>
      <line id="mkB" x1="790" y1="1445" x2="790" y2="1495" stroke="#E2685F" stroke-width="9" stroke-linecap="round"/>
      <g id="mkLabel" transform="translate(770,1570)">
        <rect x="-90" y="-56" width="180" height="92" rx="46" fill="#E2685F" stroke="#2E2019" stroke-width="8"/>
        <text x="0" y="18" text-anchor="middle" style="font-family:'Baloo',sans-serif;font-weight:800;font-size:62px" fill="#FFFFFF">2cm</text>
      </g>
    </g>

    <!-- sparkles -->
    <g id="sparkles" opacity="0" fill="#FFD25A" stroke="#2E2019" stroke-width="6" stroke-linejoin="round">
      <path id="sp1" d="M 0 -40 L 10 -10 L 40 0 L 10 10 L 0 40 L -10 10 L -40 0 L -10 -10 Z" transform="translate(880,1160)"/>
      <path id="sp2" d="M 0 -30 L 8 -8 L 30 0 L 8 8 L 0 30 L -8 8 L -30 0 L -8 -8 Z" transform="translate(960,1260)"/>
      <path id="sp3" d="M 0 -26 L 7 -7 L 26 0 L 7 7 L 0 26 L -7 7 L -26 0 L -7 -7 Z" transform="translate(760,1180)"/>
    </g>
  </g>
  <rect id="vigRect" x="0" y="0" width="1080" height="1920" fill="url(#vig)" opacity="0"/>
  <rect id="flash" x="0" y="0" width="1080" height="1920" fill="#FFFFFF" opacity="0"/>
</svg>

<div class="cap" id="cap1">POV: you moved his food bowl 2cm</div>
<div class="cap" id="cap2">I will be contacting<br>my lawyer.</div>
<div class="cap" id="cap3">Order has been restored.</div>
<div id="outro"><div class="t1">Biscuit<br><span>has opinions.</span></div><div class="t2">Follow for daily drama</div></div>
</div>

<script>
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lin = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeIn = x => x * x * x;
const easeInOut = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const backOut = x => { const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const mix = (a, b, k) => a + (b - a) * k;

// caption: pop in at a, out at b; top position y
function caption(el, t, a, b, top) {
  const kin = lin(t, a, a + 0.32), kout = lin(t, b - 0.25, b);
  const s = mix(0.6, 1, backOut(kin)) * mix(1, 0.85, easeIn(kout));
  el.style.opacity = (t < a || t > b) ? 0 : Math.min(kin * 2.2, 1 - kout);
  el.style.top = top + "px";
  el.style.transform = `scale(${s})`;
}

window.render = function (t) {
  // ---- bowl position: 840 home, 880 moved
  const handIn = easeOut(lin(t, 1.45, 1.95));
  const drag = easeInOut(lin(t, 2.0, 2.45));
  const handOut = easeIn(lin(t, 2.55, 3.0));
  const pull = easeInOut(lin(t, 8.85, 9.55));
  let bowlX = 840 + 40 * drag - 40 * pull;
  $("bowl").setAttribute("transform", `translate(${bowlX},1395)`);

  // ---- human hand from right, gripping bowl's right edge (bowlX + 100)
  const handTipIn = mix(1200, bowlX + 92, handIn);
  const handX = handOut > 0 ? mix(bowlX + 92, 1200, handOut) : handTipIn;
  $("hand").setAttribute("transform", `translate(${handX},1350)`);
  $("hand").style.opacity = (t > 1.4 && t < 3.05) ? 1 : 0;

  // ---- marker
  const mk = lin(t, 2.5, 2.75) * (1 - lin(t, 4.5, 4.75));
  $("marker").setAttribute("opacity", mk);
  $("mkLabel").setAttribute("transform", `translate(770,${1570 + 30 * (1 - easeOut(lin(t, 2.5, 2.8)))}) scale(${mix(0.5, 1, backOut(lin(t, 2.5, 2.85)))})`);

  // ---- cat reach paw (8.5 - 10.2)
  const reachOutK = easeOut(lin(t, 8.45, 8.85));
  const reachBack = easeIn(lin(t, 9.65, 10.05));
  const tipX = (t < 9.6) ? mix(700, bowlX - 98, reachOutK) : mix(bowlX - 98, 700, reachBack);
  $("reachOut").setAttribute("x2", tipX); $("reachIn").setAttribute("x2", tipX);
  $("reach").setAttribute("opacity", (t > 8.45 && t < 10.05) ? 1 : 0);
  $("pawR").setAttribute("opacity", (t > 8.45 && t < 10.05) ? 0 : 1);

  // ---- expression states
  const shock = t >= 2.62 && t < 8.4;
  const smug = t >= 8.4;
  // pupils look toward bowl at 2.45
  const look = easeOut(lin(t, 2.42, 2.6));
  let pupR = 28, eyeRy = 52, eyeRx = 46;
  if (shock) { const k = backOut(lin(t, 2.62, 2.85)); eyeRy = mix(52, 70, k); eyeRx = mix(46, 56, k); pupR = mix(28, 13, k); }
  // blink at 1.1
  const blink = 1 - Math.sin(Math.PI * lin(t, 1.0, 1.22)) * 0.95;
  const ry = eyeRy * (shock ? 1 : blink);
  const px = shock ? Math.sin(t * 46) * 2.5 : 14 * look;
  for (const s of ["L", "R"]) {
    $("eye" + s + "w").setAttribute("ry", ry); $("eye" + s + "w").setAttribute("rx", eyeRx);
    $("pup" + s).setAttribute("r", Math.min(pupR, ry * 0.55)); $("pup" + s).setAttribute("cx", px);
    $("hl" + s).setAttribute("cx", px - 10);
    $("hl" + s).setAttribute("opacity", ry > 20 ? 1 : 0);
  }
  $("eyesOpen").setAttribute("opacity", smug ? 0 : 1);
  $("eyesClosed").setAttribute("opacity", smug ? 1 : 0);
  $("brows").setAttribute("opacity", (t > 4.8 && t < 8.4) ? 1 : 0);
  $("mNeutral").setAttribute("opacity", (!shock && !smug) ? 1 : 0);
  $("mShock").setAttribute("opacity", shock ? 1 : 0);
  $("mShock").setAttribute("ry", shock ? mix(10, 40, backOut(lin(t, 2.62, 2.9))) : 40);
  $("mSmug").setAttribute("opacity", smug ? 1 : 0);
  $("sweat").setAttribute("opacity", (t > 3.0 && t < 4.8) ? 1 : 0);
  $("sweat").setAttribute("transform", `translate(0,${18 * lin(t, 3.0, 4.8)})`);

  // ears flatten in shock
  const earK = shock ? backOut(lin(t, 2.62, 2.85)) : (smug ? 0 : 0);
  $("earL").setAttribute("transform", `rotate(${-28 * earK} 430 760)`);
  $("earR").setAttribute("transform", `rotate(${28 * earK} 650 760)`);

  // head: idle bob, smug tilt
  const bob = Math.sin(t * 3.1) * 5 * (shock ? 0 : 1);
  const tilt = smug ? 7 * easeOut(lin(t, 8.4, 8.8)) : 0;
  const jump = shock ? -26 * Math.sin(Math.PI * lin(t, 2.62, 2.9)) : 0;
  $("head").setAttribute("transform", `translate(0,${bob + jump}) rotate(${tilt} 540 900)`);

  // tail wag (fluffed + still in shock)
  const wag = shock ? 0 : Math.sin(t * 4.2) * 7;
  $("tail").setAttribute("transform", `rotate(${wag} 660 1340)`);

  // ---- camera
  const zin = easeOut(lin(t, 4.8, 5.15));
  const zout = easeInOut(lin(t, 7.95, 8.4));
  const z = 1.12 + 0.68 * zin * (1 - zout);
  const shake = (t > 4.8 && t < 8.0) ? 1 : 0;
  const hitShake = Math.max(0, 1 - (t - 5.0) / 0.35) * (t >= 5.0 ? 1 : 0) + Math.max(0, 1 - (t - 6.0) / 0.35) * (t >= 6.0 ? 1 : 0);
  const sx = shake * (Math.sin(t * 37) * 3 + Math.sin(t * 91) * 2) + hitShake * Math.sin(t * 120) * 10;
  const sy = shake * (Math.cos(t * 41) * 3) + hitShake * Math.cos(t * 110) * 8;
  const cy = mix(1010, 960, zin * (1 - zout));
  $("cam").setAttribute("transform", `translate(${540 + sx},${cy + sy}) scale(${z}) translate(-540,-900)`);
  $("vigRect").setAttribute("opacity", 0.9 * zin * (1 - zout));
  $("flash").setAttribute("opacity", 0.55 * Math.max(0, 1 - (t - 2.62) / 0.18) * (t >= 2.62 ? 1 : 0));

  // sparkles at restore
  const spk = lin(t, 9.5, 9.7) * (1 - lin(t, 10.9, 11.2));
  $("sparkles").setAttribute("opacity", spk);
  [["sp1", 880, 1160, 0], ["sp2", 960, 1260, 0.7], ["sp3", 760, 1180, 1.4]].forEach(([id, x, y, ph]) => {
    const sc = 0.8 + 0.25 * Math.sin(t * 9 + ph);
    $(id).setAttribute("transform", `translate(${x},${y}) rotate(${t * 60 + ph * 30}) scale(${sc})`);
  });

  // ---- captions
  caption($("cap1"), t, 0.0, 4.75, 230);
  caption($("cap2"), t, 5.15, 7.95, 170);
  caption($("cap3"), t, 9.0, 11.0, 300);
  // first frame should already show cap1 settled
  if (t < 0.32) { $("cap1").style.opacity = 1; $("cap1").style.transform = "scale(1)"; }

  // ---- outro
  const ok = easeOut(lin(t, 11.05, 11.45));
  $("outro").style.opacity = ok;
  $("outro").style.transform = `translateY(${40 * (1 - ok)}px)`;
};
window.render(0);
</script>
</body>
</html>
